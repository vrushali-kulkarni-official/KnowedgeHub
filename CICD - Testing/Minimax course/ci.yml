# =============================================================================
# ci.yml — Main CI pipeline: lint, type-check, test, coverage
# Triggered on: every push to a PR and every push to main
# Goal: fast feedback on code quality before security/perf/AI evals run
# =============================================================================

name: CI

# Cancel any in-progress run for the same branch when a new commit is pushed.
# Saves CI minutes and gives you the freshest result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only run on PRs and pushes to main / release branches.
on:
  pull_request:
    branches: [main, release/**]
  push:
    branches: [main, release/**]
  # Allow manual trigger from the Actions tab (useful for debugging).
  workflow_dispatch:

# Read-only token by default; jobs opt in to more.
permissions:
  contents: read

# Environment variables available to all jobs in this workflow.
env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.3"   # or "pip" if you don't use poetry
  UV_VERSION: "0.4.18"      # uv is a fast drop-in for pip/poetry

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Lint + Format check (Ruff)
  # Fastest check. Catches syntax errors, unused imports, style issues.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so pre-commit / detect-secrets can scan everything.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip  # caches pip downloads between runs (huge speedup)

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Ruff lint (catches bugs, unused imports, etc.)
        # --fix=false: in CI we WANT failures, not auto-fixes.
        # --output-format=github: annotations show up inline in the PR.
        run: ruff check --output-format=github .

      - name: Ruff format check (Black-compatible)
        # --check: only reports, doesn't modify files.
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # JOB 2: Static type checking
  # Two type checkers run in parallel — they catch different things.
  # Mypy is the standard. Pyright is faster and stricter.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type check (Mypy + Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv (10-100x faster than pip)
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Mypy
        # --strict: enable all strict checks. Remove if you want gradual typing.
        # --install-types: auto-installs type stubs for third-party libs.
        run: uv run mypy --install-types --non-interactive --strict brain/ services/ agents/

      - name: Run Pyright
        # Pyright is Microsoft-authored, very fast, stricter than Mypy.
        # Running both catches what the other misses.
        run: uv run pyright brain/ services/ agents/

  # ---------------------------------------------------------------------------
  # JOB 3: Unit tests with coverage
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: [lint, typecheck]  # only run if lint+typecheck pass (fail fast)
    services:
      # Spin up Postgres for integration-style unit tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports: ["6333:6333"]
    env:
      # These point the test suite at the services above.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0
      MONGO_URL: mongodb://localhost:27017
      QDRANT_URL: http://localhost:6333
      # Test mode flag so the app uses test configs.
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=brain --cov=services --cov=agents --cov=skills \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=test-results/junit.xml \
            -v
        # --cov-fail-under=80: build fails if coverage drops below 80%.
        # Tighten to 90 once you're stable.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}  # optional, codecov is free for OSS
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # ---------------------------------------------------------------------------
  # JOB 4: Property-based + mutation testing on a NIGHTLY schedule
  # (Hypothesis + mutmut are too slow for every PR.)
  # ---------------------------------------------------------------------------
  deep-tests:
    name: Property-based + mutation (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Hypothesis property tests
        run: uv run pytest --hypothesis-show-statistics tests/property
      - name: mutmut mutation testing
        # mutmut modifies your code in-place to introduce bugs,
        # then checks if your tests catch them. The point:
        # if a test still passes after the code is broken, the test is useless.
        run: |
          uv run mutmut run --th 80  # --th=80: stop when mutation score >= 80%
          uv run mutmut results
        # Note: mutmut is slow. Run only on nightly + on critical modules.

  # ---------------------------------------------------------------------------
  # JOB 5: API contract testing with Schemathesis
  # Pulls your FastAPI's OpenAPI schema and generates edge-case requests.
  # ---------------------------------------------------------------------------
  api-contract:
    name: API contract (Schemathesis)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Start FastAPI app in background
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
        run: |
          uv run uvicorn GUI:app --host 127.0.0.1 --port 8000 &
          # wait for server to be ready
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
      - name: Run Schemathesis
        # --checks=all: run all built-in checks (status, schema, response shape, etc.)
        # --max-examples=100: generate 100 random-but-valid inputs per endpoint.
        run: |
          uv run schemathesis run \
            http://127.0.0.1:8000/openapi.json \
            --checks=all \
            --max-examples=100 \
            --hypothesis-max-examples=200

  # ---------------------------------------------------------------------------
  # JOB 6: Workflow lint (actionlint)
  # Catches typos and mistakes in your .github/workflows/*.yml files.
  # ---------------------------------------------------------------------------
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.7
        with:
          # shellcheck integration: lints any 'run:' shell scripts in your workflows
          shellcheck: "shellcheck"
