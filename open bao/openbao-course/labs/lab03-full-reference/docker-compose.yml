name: openbao-lab03

# ─────────────────────────────────────────────────────────────────
# Lab 03 — Full production reference stack (Level 7 of the course)
#
#   openbao   — secrets manager (Raft, TLS, audit)
#   keycloak  — OIDC identity provider for humans
#   postgres  — application database + OpenBao dynamic-credential target
#   redis     — application cache
#   app       — FastAPI + LangChain harness
#   bao-agent — sidecar that authenticates to OpenBao for the app
#
#   ⚠️  Single-host simulation of a multi-service estate.
#       Each service here is exactly how you'd run it in production,
#       minus the multi-node HA (see lab02) and the network policy.
# ─────────────────────────────────────────────────────────────────

services:
  # ══════════════════════ OpenBao ══════════════════════
  openbao:
    image: openbao/openbao:2.7.1
    container_name: openbao
    command: server -config=/openbao/config/openbao.hcl
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config:/openbao/config:ro
      - ./certs:/openbao/certs:ro
      - openbao-data:/openbao/data
      - ./logs:/openbao/logs
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/certs/ca.crt
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "BAO_CACERT=/openbao/certs/ca.crt bao status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  # ══════════════════════ Keycloak ══════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [backend]

  # ══════════════════════ PostgreSQL ══════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  # ══════════════════════ Redis ══════════════════════
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  # ══════════════════════ bao agent sidecar ══════════════════════
  bao-agent:
    image: openbao/openbao:2.7.1
    container_name: bao-agent
    command: agent -config=/agent/config/agent.hcl
    volumes:
      - ./config:/agent/config:ro
      - ./certs:/openbao/certs:ro
      - agent-secrets:/secrets
    depends_on:
      openbao:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  # ══════════════════════ The app ══════════════════════
  app:
    build:
      context: ./app
    container_name: harness-app
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/certs/ca.crt
      APPROLE_ROLE_ID: ${APPROLE_ROLE_ID:-}
      APPROLE_SECRET_ID: ${APPROLE_SECRET_ID:-}
      SECRET_PATH: myapp
      DB_HOST: postgres
      DB_NAME: appdb
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/enterprise
    volumes:
      - ./certs:/certs:ro
      - agent-secrets:/secrets:ro
    depends_on:
      openbao:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      bao-agent:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  openbao-data:
  pgdata:
  redisdata:
  agent-secrets:
